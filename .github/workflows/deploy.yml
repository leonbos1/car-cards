name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/car-pack-opening-app-u3u8dw
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      # GITHUB_TOKEN cannot create a Pages site; enable it once by hand under
      # Settings > Pages, deploying from the gh-pages branch this job publishes.
      - uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          enable_jekyll: false
